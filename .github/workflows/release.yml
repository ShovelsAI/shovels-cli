name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test -count=1 ./...

      # The e2e suite is entirely httptest stubs — no API key, no network, fully
      # deterministic — but it lives behind an `e2e` build tag, so plain
      # `go test ./...` silently excludes it. It had never run in CI. It is the
      # cheapest guard against another Cobra flag-registration regression of the
      # kind that shipped as ENG-4040, so it runs on every PR and every release.
      - name: Run e2e tests
        run: go test -count=1 -tags=e2e ./e2e/...

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
