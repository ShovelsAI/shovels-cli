name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test -count=1 ./...

      # The e2e suite is entirely httptest stubs — no API key, no network, fully
      # deterministic — but it lives behind an `e2e` build tag, so plain
      # `go test ./...` silently excludes it. It had never run in CI. It is the
      # cheapest guard against another Cobra flag-registration regression of the
      # kind that shipped as ENG-4040, so it runs on every PR and every release.
      - name: Run e2e tests
        run: go test -count=1 -tags=e2e ./e2e/...

      # The command-contract guard walks the cobra tree and fails on a runnable
      # command with no contract record. The `_test-*` fixture commands are
      # `//go:build e2e`, so the plain unit run cannot see them and the e2e run
      # above does not compile ./cmd tests: the guard is only fixture-aware under
      # this third invocation.
      - name: Run cmd tests with the fixture commands compiled
        run: go test -count=1 -tags=e2e ./cmd/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Build-tagged packages are invisible to `go vet ./...` and to the test
      # job, so a rename or signature change in a shared helper merges green and
      # surfaces later as a build error inside a nightly failure report. Vetting
      # them is free: no key, no network, no live calls.
      - name: Vet build-tagged packages
        run: |
          go vet -tags=integration ./integration/...
          go vet -tags=eval ./evals/...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binary
        run: go build -o shovels .
